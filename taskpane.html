<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>白皮批量制作助手 v1.0</title>
    <link rel="stylesheet" href="taskpane.css">
</head>

<body>
    <input
        type="file"
        id="excelFilePicker"
        accept=".xlsx,.xls"
        style="display: none;"
    >
    <div class="container">
        <header class="header">
            <h1>白皮批量制作助手 v1.0</h1>
            <p class="subtitle">选择数据与模板，一键批量生成</p>
        </header>

        <!-- 文件选择区 -->
        <section class="section">
            <h2>文件配置</h2>
            
            <div class="form-group">
                <label>Excel 数据文件</label>
                <div class="file-row">
                    <input type="text" id="excelPath" readonly placeholder="请选择Excel文件 (.xlsx/.xls)">
                    <button class="btn btn-sm" onclick="selectExcel()">浏览</button>
                </div>
            </div>

            <div class="form-group">
                <label>白皮模板文件</label>

    
                <div class="file-row">
                    <input
                    type="text"
                    id="templatePath"
                    readonly
                    placeholder="请选择模板文件 (.doc/.docx/.xlsx)"
                >

                <button
                    class="btn btn-sm"
                    onclick="selectTemplate()"
                >
                    浏览
                </button>
            </div>

            <div
                id="templateTypeRow"
                class="info-row"
                style="display:none; margin-top:8px;"
            >
                <span class="label">模板类型：</span>
                <span
                    id="templateTypeText"
                    class="value"
                >
                    -
                </span>
            </div>

            <div
                id="templateSheetRow"
                class="info-row"
                style="display:none; margin-top:4px;"
            >
                <span class="label">模板工作表：</span>
                <span
                    id="templateSheetName"
                    class="value"
                >
                    -
                </span>
            </div>
        </div>
            
            <div class="form-group">
                <label>输出文件夹</label>
                <div class="file-row">
                    <input type="text" id="outputPath" readonly placeholder="请选择输出目录">
                    <button class="btn btn-sm" onclick="selectOutput()">浏览</button>
                </div>
            </div>
        </section>

        <!-- 识别结果区 -->
        <section class="section" id="resultSection" style="display:none;">
            <h2>识别结果</h2>
            
            <div class="info-row">
                <span class="label">工作表：</span>
                <span id="sheetName" class="value">-</span>
            </div>
            <div class="info-row">
                <span class="label">数据条数：</span>
                <span id="dataCount" class="value">-</span>
            </div>
            <div class="info-row" id="compatibilityRow">
                <span class="label">模板匹配：</span>
                <span id="compatibilityStatus" class="value status-wait">待检查</span>
            </div>
            <div id="compatibilityDetails" class="compatibility-details">
                选择数据表和模板后自动检查。
            </div>

            <div class="field-map-title">字段映射：</div>
            <div id="fieldMapping" class="field-map-list"></div>
        </section>

        <!-- 选项区 -->
        <section class="section">
            <h2>生成选项</h2>
            <label class="checkbox-item">
                <input type="checkbox" id="strictFormat" checked>
                <span>严格保持模板格式</span>
            </label>
            <label class="checkbox-item">
                <input type="checkbox" id="autoCenter" checked>
                <span>自动进行上下中心线校验</span>
            </label>
            <label class="checkbox-item">
                <input type="checkbox" id="verifyAfterSave" checked>
                <span>保存后重新打开校验</span>
            </label>
            <label class="checkbox-item">
                <input type="checkbox" id="preventOverwrite" checked>
                <span>禁止覆盖已有文件</span>
            </label>
        </section>

        <!-- 操作按钮区 -->
        <section class="section">
            <div class="btn-group">
                <button class="btn btn-secondary" id="btnPreview" onclick="previewFirst()" disabled>预览第一份</button>
                <button class="btn btn-primary" id="btnStart" onclick="startBatch()" disabled>批量生成</button>
            </div>
            <button class="btn btn-danger btn-block" id="btnCancel" onclick="cancelBatch()" disabled>取消任务</button>
        </section>

        <!-- 进度区 -->
        <section class="section" id="progressSection" style="display:none;">
            <h2>生成进度</h2>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text">
                <span id="currentBook">准备中...</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="stats-row">
                <span class="success">成功: <span id="successCount">0</span></span>
                <span class="fail">失败: <span id="failCount">0</span></span>
            </div>
        </section>

        <!-- 错误日志区 -->
        <section class="section" id="logSection" style="display:none;">
            <h2>错误日志</h2>
            <div id="errorLog" class="error-log"></div>
        </section>

        <!-- 结果列表区 -->
        <section class="section" id="resultListSection" style="display:none;">
            <h2>生成结果</h2>
            <div id="resultList" class="result-list"></div>
            <button class="btn btn-secondary btn-block" onclick="openOutputFolder()">打开输出文件夹</button>
        </section>

        <footer class="footer">
            <span>白皮批量制作助手 v1.0</span>
        </footer>

    <script src="modules/logger.js"></script>
    <script src="./lib/xlsx.full.min.js"></script>
    <script src="./lib/jszip.min.js"></script>
    <script src="./modules/fieldRegistry.js"></script>
    <script src="./modules/xlsxTemplateEngine.js"></script>
    <script src="modules/excelReader.js"></script>
    <script src="modules/templateAnalyzer.js"></script>
    <script src="modules/wordReplacer.js"></script>
    <script src="modules/alignment.js"></script>
    <script src="modules/fileManager.js"></script>
    <script src="modules/validator.js"></script>
    <script src="taskpane.js"></script>
</body>
</html>
